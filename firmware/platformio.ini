; Teensy 4.1 firmware for the quadruped.
;
;   pio run              build
;   pio run -t upload    build and flash
;   pio device monitor   serial console
;
; Arduino IDE instead? Rename src/main.cpp to firmware.ino, move it and the
; other sources into one folder named `firmware`, and open that. PlatformIO
; is used here because it builds from the command line and pins versions.

[env:teensy41]
platform      = teensy
board         = teensy41
framework     = arduino
monitor_speed = 115200
build_flags   = -Wall -Wextra
